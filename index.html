<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>画像マーカーAR</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:sans-serif}#guide{position:fixed;z-index:10;left:50%;top:18px;transform:translateX(-50%);background:#fffffff0;padding:10px 16px;border-radius:999px;font-weight:800;text-align:center;max-width:88vw}#openSite{display:none;position:fixed;z-index:20;left:50%;bottom:34px;transform:translateX(-50%);border:0;border-radius:16px;padding:16px 26px;background:#1769e0;color:#fff;font-size:18px;font-weight:900}#openSite.show{display:block}</style>
</head><body>
<div id="guide">キャラクター画像にカメラを向けてください</div>
<button id="openSite">ICT公開研究会サイトを開く ↗</button>
<a-scene mindar-image="imageTargetSrc: ./targets.mind;" color-space="sRGB" renderer="colorManagement:true;physicallyCorrectLights:true" vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false">
<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
<a-entity id="target" mindar-image-target="targetIndex:0">
<a-plane position="0 .68 .02" width="1.18" height=".25" color="#1769e0" opacity=".94"></a-plane>
<a-text value="ICT PUBLIC RESEARCH" align="center" color="#fff" position="0 .68 .035" width="1.55"></a-text>
<a-plane position="0 .40 .02" width=".82" height=".18" color="#fff" opacity=".96"></a-plane>
<a-text value="SITE OPEN" align="center" color="#1769e0" position="0 .40 .035" width="1.15"></a-text>
</a-entity></a-scene>
<script>
document.addEventListener("DOMContentLoaded",()=>{const t=document.querySelector("#target"),b=document.querySelector("#openSite"),g=document.querySelector("#guide");t.addEventListener("targetFound",()=>{g.textContent="認識しました！";b.classList.add("show")});t.addEventListener("targetLost",()=>{g.textContent="キャラクター画像にカメラを向けてください";b.classList.remove("show")});b.onclick=()=>location.href="https://sciencelabo-yoshi.github.io/ict/";});
</script></body></html>
