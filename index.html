<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>画像マーカーAR</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
:root{--blue:#1f5eff;--navy:#17345f;--ink:#20242b;--line:#dbe3ee}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
#guide{position:fixed;z-index:10;left:50%;top:20px;transform:translateX(-50%);
width:min(88vw,520px);background:rgba(255,255,255,.96);border:1px solid var(--line);
padding:13px 20px;border-radius:14px;color:var(--ink);font-weight:800;text-align:center;
box-shadow:0 6px 24px rgba(20,45,80,.14)}
#guide .tag{display:block;color:var(--blue);font-size:12px;letter-spacing:.08em;margin-bottom:3px}
#openSite{display:none;position:fixed;z-index:20;left:50%;bottom:30px;transform:translateX(-50%);
width:min(90vw,500px);border:0;border-radius:16px;padding:16px 22px;background:rgba(255,255,255,.97);
color:var(--navy);font-size:17px;font-weight:900;box-shadow:0 10px 32px rgba(0,0,0,.25);
border-left:6px solid var(--blue);cursor:pointer;text-align:left}
#openSite.show{display:block;animation:rise .35s ease both}
#openSite .title{display:block;color:var(--blue);font-size:13px;letter-spacing:.05em;margin-bottom:4px}
#openSite .sub{display:block;font-size:12px;font-weight:600;color:#687487;margin-top:4px}
@keyframes rise{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
</style>
</head><body>
<div id="guide"><span class="tag">ICT公開研究会・実践発表</span>表紙にカメラを向けてください</div>
<button id="openSite"><span class="title">IMAGE MARKER AR</span>ICT公開研究会サイトを開く →<span class="sub">教材・実践事例をご覧いただけます</span></button>
<a-scene mindar-image="imageTargetSrc: ./targets.mind;" color-space="sRGB" renderer="colorManagement:true;physicallyCorrectLights:true" vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false">
<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
<a-entity id="target" mindar-image-target="targetIndex:0">
<a-plane position="0 .68 .02" width="1.18" height=".25" color="#1769e0" opacity=".94"></a-plane>
<a-text value="ICT PUBLIC RESEARCH" align="center" color="#fff" position="0 .68 .035" width="1.55"></a-text>
<a-plane position="0 .40 .02" width=".82" height=".18" color="#fff" opacity=".96"></a-plane>
<a-text value="SITE OPEN" align="center" color="#1769e0" position="0 .40 .035" width="1.15"></a-text>
</a-entity></a-scene>
<script>
document.addEventListener("DOMContentLoaded",()=>{const t=document.querySelector("#target"),b=document.querySelector("#openSite"),g=document.querySelector("#guide");t.addEventListener("targetFound",()=>{g.innerHTML='<span class="tag">IMAGE MARKER AR</span>表紙を認識しました';b.classList.add("show")});t.addEventListener("targetLost",()=>{g.innerHTML='<span class="tag">ICT公開研究会・実践発表</span>表紙にカメラを向けてください';b.classList.remove("show")});b.onclick=()=>location.href="https://sciencelabo-yoshi.github.io/ict/";});
</script></body></html>
