<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>画像マーカーAR</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
:root{--blue:#1f5eff;--navy:#17345f;--ink:#20242b}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
#arCard{display:none;position:fixed;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);width:min(90vw,440px);text-align:center;pointer-events:none}
#arCard.show{display:block;animation:appear .38s ease both}
#bubble{position:relative;box-sizing:border-box;width:100%;max-width:420px;background:rgba(255,255,255,.97);border:3px solid var(--navy);border-radius:30px;padding:22px 24px 24px;color:var(--ink);font-size:16px;font-weight:850;line-height:1.6;box-shadow:0 8px 28px rgba(0,0,0,.18);margin:0 auto 22px;cursor:pointer;pointer-events:auto;-webkit-tap-highlight-color:transparent}
#bubble::after{content:"";position:absolute;left:50%;bottom:-18px;transform:translateX(-50%) rotate(45deg);width:30px;height:30px;background:#fff;border-right:3px solid var(--navy);border-bottom:3px solid var(--navy)}
#bubble strong{color:var(--blue)}
#mascot{display:block;width:min(48vw,220px);max-height:32vh;object-fit:contain;margin:0 auto;filter:drop-shadow(0 8px 10px rgba(0,0,0,.18))}
@keyframes appear{from{opacity:0;transform:translate(-50%,-46%) scale(.94)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@media (max-height:700px){
  #arCard{top:49%}
  #bubble{padding:16px 18px 18px;font-size:14px;line-height:1.55;margin-bottom:18px}
  #mascot{width:min(42vw,185px);max-height:27vh}
}
</style></head><body>
<div id="arCard">
  <div id="bubble" role="button" tabindex="0" aria-label="ICT公開研修会・実践発表のページを開く">
    <span><strong>ICT公開研修会・実践発表</strong>のページは<br>ここをクリックしてください</span>
  </div>
  <img id="mascot" src="./nakkyon_guide.png" alt="案内キャラクター">
</div>
<a-scene mindar-image="imageTargetSrc: ./targets.mind;" color-space="sRGB" renderer="colorManagement:true;physicallyCorrectLights:true" vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false">
<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
<a-entity id="target" mindar-image-target="targetIndex:0"></a-entity></a-scene>
<script>
document.addEventListener("DOMContentLoaded", function () {
  const target = document.querySelector("#target");
  const card = document.querySelector("#arCard");
  const bubble = document.querySelector("#bubble");
  const destination = "https://sciencelabo-yoshi.github.io/ict/";

  target.addEventListener("targetFound", function () {
    card.classList.add("show");
  });
  target.addEventListener("targetLost", function () {
    card.classList.remove("show");
  });
  bubble.addEventListener("click", function () {
    window.location.href = destination;
  });
  bubble.addEventListener("keydown", function (event) {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      window.location.href = destination;
    }
  });
});
</script>
</body></html>
